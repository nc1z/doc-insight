name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm lint

      - run: cp .env.example .env && sed -i -E 's/^(LLM|CLASSIFIER|VISION)_PROVIDER=.*/\1_PROVIDER=mock/' .env

      - run: docker compose up -d postgres-test --wait

      - run: pnpm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: cp .env.example .env && sed -i -E 's/^(LLM|CLASSIFIER|VISION)_PROVIDER=.*/\1_PROVIDER=mock/' .env

      - run: docker compose up -d --build --wait

      - run: curl --fail http://localhost:8080/api/health

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm bruno

      - run: pnpm --filter frontend exec playwright install --with-deps chromium

      - run: pnpm --filter frontend test:e2e

      - if: failure()
        run: docker compose logs

      - if: always()
        run: docker compose down
