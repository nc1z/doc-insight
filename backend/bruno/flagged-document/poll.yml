info:
  name: Poll flagged document
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/jobs/{{jobId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const attempt = Number(bru.getVar("pollAttempt") || 0) + 1;
        bru.setVar("pollAttempt", String(attempt));
        const status = res.body.status;
        const processing = ["queued", "running", "consolidating"];

        test("job is processing or finished", function () {
          expect(res.status).to.equal(200);
          expect(processing.concat(["succeeded"])).to.include(status);
        });

        if (processing.includes(status) && attempt < 30) {
          await bru.sleep(1000);
          bru.setNextRequest("Poll flagged document");
        } else {
          bru.setVar("pollAttempt", "0");
          test("succeeds and flags the hidden text", function () {
            expect(status).to.equal("succeeded");
            expect(res.body.documents).to.have.length(1);
            const document = res.body.documents[0];
            expect(document.filename).to.equal("hidden-note.pdf");
            expect(document.flagged).to.equal(true);
            expect(document.flag_reasons).to.eql(["hidden_text"]);
            expect(document.summary.summary).to.equal("Mock summary of hidden-note.pdf.");
            expect(res.body.progress).to.eql({ completed_steps: 3, total_steps: 3 });
          });
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
