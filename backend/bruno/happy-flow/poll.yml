info:
  name: Poll until succeeded
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/jobs/{{jobId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const attempt = Number(bru.getVar("pollAttempt") || 0) + 1;
        bru.setVar("pollAttempt", String(attempt));
        const status = res.body.status;
        const processing = ["queued", "running", "consolidating"];

        test("job is processing or finished", function () {
          expect(res.status).to.equal(200);
          expect(processing.concat(["succeeded"])).to.include(status);
        });

        if (processing.includes(status) && attempt < 30) {
          await bru.sleep(1000);
          bru.setNextRequest("Poll until succeeded");
        } else {
          bru.setVar("pollAttempt", "0");
          test("reaches succeeded with the mock report", function () {
            expect(status).to.equal("succeeded");
            expect(res.body.documents.map((item) => item.filename).sort()).to.eql([
              "broker-flash.pdf",
              "desk-note.pdf",
            ]);
            expect(res.body.documents.map((item) => item.summary.summary).sort()).to.eql([
              "Mock summary of broker-flash.pdf.",
              "Mock summary of desk-note.pdf.",
            ]);
            expect(res.body.documents.every((item) => item.flagged === false)).to.equal(true);
            expect(res.body.report.summary).to.include("desk-note.pdf");
            expect(res.body.report.summary).to.include("broker-flash.pdf");
            expect(res.body.report.excluded_files).to.eql([]);
            expect(res.body.progress).to.eql({ completed_steps: 6, total_steps: 6 });
          });
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
