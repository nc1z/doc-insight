info:
  name: Get
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/jobs/{{jobId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("shows both documents queued", function () {
          expect(res.body.status).to.equal("queued");
          expect(res.body.documents.map((item) => item.filename).sort()).to.eql([
            "broker-flash.pdf",
            "desk-note.pdf",
          ]);
          expect(res.body.rejected_files).to.eql([]);
          expect(res.body.excluded_files).to.eql([]);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
