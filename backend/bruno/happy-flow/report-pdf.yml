info:
  name: Download report PDF
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/jobs/{{jobId}}/report.pdf"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns a PDF attachment", function () {
          expect(res.status).to.equal(200);
          expect(res.headers["content-type"]).to.equal("application/pdf");
          expect(res.headers["content-disposition"]).to.include("attachment");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
