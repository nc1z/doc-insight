info:
  name: Upload a readable and an unreadable file
  type: http
  seq: 1
  tags:
    - manual

docs: |
  Manual only. `pnpm bruno` skips this folder.

  `unreadable.pdf` is a blank page, so extraction succeeds on it. To run this flow, make `extract_text` in `backend/app/pipeline/steps.py` throw `StepFailure("unreadable_document", permanent=True)` for that filename, restart the worker, then run `pnpm bruno:manual`. Remove the throw afterwards. The polls expect that code and the message "The document could not be read."

http:
  method: POST
  url: "{{baseUrl}}/jobs"
  auth: inherit
  body:
    type: multipart-form
    data:
      - name: files
        type: file
        value:
          - ../../samples/desk-note.pdf
          - ../../samples/unreadable.pdf

runtime:
  scripts:
    - type: tests
      code: |-
        test("queues both files", function () {
          expect(res.body.status).to.equal("queued");
          expect(res.body.id).to.be.a("string").and.not.empty;
          bru.setVar("jobId", res.body.id);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "202"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
