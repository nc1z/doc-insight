info:
  name: Upload
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/jobs"
  auth: inherit
  body:
    type: multipart-form
    data:
      - name: files
        type: file
        value:
          - ../../samples/desk-note.pdf
          - ../../samples/invalid/notes.pdf

runtime:
  scripts:
    - type: tests
      code: |-
        test("waits for a decision", function () {
          expect(res.body.status).to.equal("awaiting_input");
          expect(res.body.accepted.map((item) => item.filename)).to.eql(["desk-note.pdf"]);
          expect(res.body.rejected).to.eql([
            {
              filename: "notes.pdf",
              code: "unsupported_type",
              message: "The file is not a PDF.",
            },
          ]);
          bru.setVar("jobId", res.body.id);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
