info:
  name: Get
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/jobs/{{jobId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("shows the waiting job", function () {
          expect(res.body.status).to.equal("awaiting_input");
          expect(res.body.documents.map((item) => item.filename)).to.eql(["desk-note.pdf"]);
          expect(res.body.rejected_files.map((item) => item.filename)).to.eql(["notes.pdf"]);
          expect(res.body.excluded_files).to.eql([]);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
