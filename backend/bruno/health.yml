info:
  name: Health
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/health"
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns ok", function () {
          expect(res.body).to.eql({ status: "ok" });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
