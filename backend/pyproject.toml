[project]
name = "backend"
version = "0.1.0"
description = "Doc Insight API"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.7",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.0",
    "sqlalchemy[asyncio]>=2",
]

[tool.uv]
# Only install package versions published at least 7 days ago.
exclude-newer = "7 days"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic", "sqlalchemy"]

[tool.mypy]
python_version = "3.14"
packages = ["app"]
disallow_untyped_defs = true
warn_unused_ignores = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
