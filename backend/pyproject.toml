[project]
name = "backend"
version = "0.1.0"
description = "Doc Insight API"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.7",
    "pydantic-settings>=2.16.3",
]

[tool.uv]
# Only install package versions published at least 7 days ago.
exclude-newer = "7 days"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.14"
packages = ["app"]
disallow_untyped_defs = true
warn_unused_ignores = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
