[project]
name = "backend"
version = "0.1.0"
description = "Doc Insight API"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.7",
]

[tool.uv]
# Only install package versions published at least 7 days ago.
exclude-newer = "7 days"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
